# Render (free tier) — one Docker web service running the locked
# json-server demo (docs/HOSTING.md). No persistent disk on the free
# plan: runs/keys/cache are ephemeral and the seeded run recreates
# itself on every boot. Add a `disk:` block + paid plan only if you
# need state to survive restarts.
services:
  - type: web
    name: ripplewitness-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    plan: free
    healthCheckPath: /
    envVars:
      - key: RIPPLEWITNESS_LOCKED_RUN
        value: '{"repoPath":"/subject/json-server","baseRef":"rw-base","headRef":"rw-head","scenariosDir":"/app/docs/real-repo/scenarios","seedDbRel":"seed/seed.db","appStart":["node","--experimental-strip-types","src/bin.ts","rw-db.json"]}'
      - key: RIPPLEWITNESS_HOME
        value: /data
      # Entered in the Render dashboard at deploy time; never in git.
      - key: META_API_KEY
        sync: false
